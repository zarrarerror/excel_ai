<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shayntech Admin</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0f0f13; color: #e2e8f0; font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }
  .login-wrap { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .login-card { background: #1a1a2e; border: 1px solid #2d2d44; border-radius: 16px; padding: 40px; width: 360px; }
  .login-card h1 { font-size: 22px; margin-bottom: 6px; color: #00e5a0; }
  .login-card p { font-size: 13px; color: #94a3b8; margin-bottom: 28px; }
  input { width: 100%; background: #0f0f1a; border: 1px solid #2d2d44; border-radius: 8px; padding: 12px 14px; color: #e2e8f0; font-size: 14px; outline: none; }
  input:focus { border-color: #00e5a0; }
  button.btn { width: 100%; background: #00e5a0; color: #0a0a12; font-weight: 700; border: none; border-radius: 8px; padding: 13px; font-size: 15px; cursor: pointer; margin-top: 16px; }
  button.btn:hover { background: #00c98a; }
  .err { color: #f87171; font-size: 13px; margin-top: 10px; display: none; }

  /* Dashboard */
  #dashboard { display: none; }
  .topbar { background: #1a1a2e; border-bottom: 1px solid #2d2d44; padding: 14px 28px; display: flex; align-items: center; justify-content: space-between; }
  .topbar h1 { font-size: 18px; color: #00e5a0; }
  .topbar span { font-size: 13px; color: #94a3b8; }
  .topbar button { background: transparent; border: 1px solid #2d2d44; color: #94a3b8; border-radius: 6px; padding: 6px 14px; cursor: pointer; font-size: 13px; }
  .topbar button:hover { border-color: #f87171; color: #f87171; }

  .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; padding: 24px 28px 0; }
  .stat-card { background: #1a1a2e; border: 1px solid #2d2d44; border-radius: 12px; padding: 20px; }
  .stat-card .label { font-size: 12px; color: #64748b; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px; }
  .stat-card .value { font-size: 30px; font-weight: 700; color: #e2e8f0; }
  .stat-card .value.green { color: #00e5a0; }
  .stat-card .value.amber { color: #f59e0b; }

  .table-wrap { margin: 24px 28px; background: #1a1a2e; border: 1px solid #2d2d44; border-radius: 12px; overflow: auto; }
  .table-header { padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #2d2d44; }
  .table-header h2 { font-size: 15px; font-weight: 600; }
  .table-header input { background: #0f0f1a; border: 1px solid #2d2d44; border-radius: 6px; padding: 8px 12px; color: #e2e8f0; font-size: 13px; outline: none; width: 200px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { background: #131320; color: #64748b; font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: .05em; padding: 12px 16px; text-align: left; }
  td { padding: 12px 16px; border-top: 1px solid #1e1e30; }
  tr:hover td { background: rgba(255,255,255,0.02); }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .badge.pro { background: rgba(0,229,160,0.15); color: #00e5a0; border: 1px solid rgba(0,229,160,0.3); }
  .badge.free { background: rgba(100,116,139,0.15); color: #94a3b8; border: 1px solid rgba(100,116,139,0.3); }
  .loading { text-align: center; padding: 40px; color: #64748b; font-size: 14px; }
  .refresh-btn { background: rgba(0,229,160,0.1); border: 1px solid rgba(0,229,160,0.3); color: #00e5a0; border-radius: 6px; padding: 7px 14px; cursor: pointer; font-size: 13px; }
  .refresh-btn:hover { background: rgba(0,229,160,0.2); }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="login-wrap">
  <div class="login-card">
    <h1>Shayntech Admin</h1>
    <p>Enter your admin key to access the dashboard</p>
    <input type="password" id="admin-key-input" placeholder="Admin key" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn" onclick="doLogin()">Sign In</button>
    <div class="err" id="login-err">Incorrect admin key</div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <div class="topbar">
    <h1>Shayntech Admin</h1>
    <div style="display:flex;align-items:center;gap:14px;">
      <span id="last-refresh">—</span>
      <button class="refresh-btn" onclick="loadStats()">Refresh</button>
      <button onclick="doLogout()">Sign Out</button>
    </div>
  </div>

  <div class="stats-row" id="stats-row">
    <div class="stat-card"><div class="label">Total Users</div><div class="value" id="s-total">—</div></div>
    <div class="stat-card"><div class="label">Pro Users</div><div class="value green" id="s-pro">—</div></div>
    <div class="stat-card"><div class="label">Total AI Cost</div><div class="value amber" id="s-cost">—</div></div>
    <div class="stat-card"><div class="label">Total Chats</div><div class="value" id="s-chats">—</div></div>
  </div>

  <div class="table-wrap">
    <div class="table-header">
      <h2>Users</h2>
      <input type="text" placeholder="Filter by email..." oninput="filterTable(this.value)">
    </div>
    <div id="table-body"><div class="loading">Loading...</div></div>
  </div>
</div>

<script>
var ADMIN_KEY = '';
var allUsers = [];

function doLogin() {
  var key = document.getElementById('admin-key-input').value.trim();
  if (!key) return;
  ADMIN_KEY = key;
  loadStats();
}

function doLogout() {
  ADMIN_KEY = '';
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('login-wrap').style.display = 'flex';
  document.getElementById('admin-key-input').value = '';
}

async function loadStats() {
  try {
    var res = await fetch('/api/admin/stats', {
      headers: { 'x-admin-key': ADMIN_KEY }
    });
    if (res.status === 401) {
      document.getElementById('login-err').style.display = 'block';
      return;
    }
    document.getElementById('login-err').style.display = 'none';
    document.getElementById('login-wrap').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';

    var data = await res.json();
    allUsers = data.users || [];

    // Aggregate stats
    var proCount  = allUsers.filter(u => u.is_pro).length;
    var totalCost = allUsers.reduce((s, u) => s + parseFloat(u.total_cost_usd || 0), 0);
    var totalChat = allUsers.reduce((s, u) => s + parseInt(u.total_chat_sessions || 0), 0);

    document.getElementById('s-total').textContent = allUsers.length;
    document.getElementById('s-pro').textContent   = proCount;
    document.getElementById('s-cost').textContent  = '$' + totalCost.toFixed(4);
    document.getElementById('s-chats').textContent = totalChat;
    document.getElementById('last-refresh').textContent = 'Updated ' + new Date().toLocaleTimeString();

    renderTable(allUsers);
  } catch(e) {
    alert('Failed to load stats: ' + e.message);
  }
}

function renderTable(users) {
  if (!users.length) {
    document.getElementById('table-body').innerHTML = '<div class="loading">No users found</div>';
    return;
  }
  var rows = users.map(function(u) {
    var joined = u.created_at ? new Date(u.created_at).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '—';
    var badge = u.is_pro
      ? '<span class="badge pro">PRO</span>'
      : '<span class="badge free">Free</span>';
    var cost = parseFloat(u.total_cost_usd || 0).toFixed(4);
    return '<tr>' +
      '<td>' + (u.email || '—') + '</td>' +
      '<td>' + badge + '</td>' +
      '<td>' + (u.lifetime_usage || 0) + '</td>' +
      '<td>' + (u.monthly_usage || 0) + '</td>' +
      '<td>$' + cost + '</td>' +
      '<td>' + (u.total_chat_sessions || 0) + '</td>' +
      '<td>' + joined + '</td>' +
      '</tr>';
  }).join('');
  document.getElementById('table-body').innerHTML =
    '<table><thead><tr>' +
    '<th>Email</th><th>Plan</th><th>Lifetime Uses</th><th>Monthly Uses</th><th>AI Cost</th><th>Chats</th><th>Joined</th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table>';
}

function filterTable(query) {
  var q = query.toLowerCase();
  var filtered = q ? allUsers.filter(u => (u.email||'').toLowerCase().includes(q)) : allUsers;
  renderTable(filtered);
}
</script>
</body>
</html>
