name: Pro add-in checks
on:
  push:
    paths: ['backend/**', 'addin/**', 'admin/**', 'public/**', '*.html', '.github/workflows/pro-checks.yml']
  pull_request:
    paths: ['backend/**', 'addin/**', 'admin/**', 'public/**', '*.html', '.github/workflows/pro-checks.yml']
permissions:
  contents: read
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
