<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password — Shayntech Excel AI</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#0f1117;color:#e2e8f0;
  display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.card{background:#1a1f2e;border:1px solid #2a2f45;border-radius:14px;
  padding:32px 28px;width:100%;max-width:360px}
h1{font-size:20px;font-weight:800;color:#00e5a0;margin-bottom:6px}
p{font-size:12px;color:#64748b;margin-bottom:24px}
label{display:block;font-size:11px;color:#94a3b8;margin-bottom:4px;font-weight:500}
input{width:100%;padding:10px 12px;background:#0f1117;border:1px solid #2a2f45;
  border-radius:8px;color:#e2e8f0;font-size:13px;outline:none;margin-bottom:14px}
input:focus{border-color:#00e5a0}
button{width:100%;padding:11px;background:#00e5a0;color:#000;border:none;
  border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;margin-top:4px}
button:hover{opacity:0.85}
button:disabled{opacity:0.4;cursor:not-allowed}
.msg{font-size:12px;margin-top:12px;text-align:center;min-height:18px}
.err{color:#ef4444}.ok{color:#22c55e}
</style>
</head>
<body>
<div class="card">
  <h1>✦ Reset Password</h1>
  <p>Enter your new password below.</p>
  <div id="form-area">
    <label>New Password</label>
    <input type="password" id="pw" placeholder="At least 6 characters"/>
    <label>Confirm Password</label>
    <input type="password" id="pw2" placeholder="Repeat password"/>
    <button id="submit-btn" onclick="doReset()" disabled>Setting up…</button>
    <div class="msg err" id="err"></div>
  </div>
  <div class="msg ok" id="done" style="display:none">
    ✓ Password updated! You can close this tab and sign in to the add-in.
  </div>
</div>
<script>
var sb;
var btn = document.getElementById("submit-btn");
var errEl = document.getElementById("err");
async function initializeRecovery() {
const configResponse = await fetch("/api/public-config");
const config = await configResponse.json();
if (!config.supabaseUrl || !config.supabaseAnonKey) throw new Error("Password recovery is not configured. Contact the administrator.");
sb = supabase.createClient(config.supabaseUrl, config.supabaseAnonKey, { auth: { detectSessionInUrl: false, persistSession: false } });

// Parse both query params (PKCE flow) and hash params (implicit flow)
var urlParams = new URLSearchParams(window.location.search);
var hashParams = {};
window.location.hash.substring(1).split('&').forEach(function(pair) {
  var kv = pair.split('=');
  if (kv[0]) hashParams[kv[0]] = decodeURIComponent(kv[1] || '');
});



function onSessionReady(result) {
  if (result.error || !result.data || !result.data.session) {
    errEl.textContent = 'Link expired or invalid. Please request a new reset link.';
  } else {
    history.replaceState(null, '', window.location.pathname);
    btn.textContent = 'Set New Password';
    btn.disabled = false;
  }
}

var code = urlParams.get('code');
if (hashParams.error_code === 'otp_expired' || hashParams.error === 'access_denied') {
  // Link expired — show friendly message with back button
  document.getElementById('form-area').innerHTML =
    '<p style="color:#ef4444;font-size:13px;margin-bottom:16px;">Your reset link has expired (links are valid for 1 hour).</p>' +
    '<a href="/" style="display:block;width:100%;padding:11px;background:#00e5a0;color:#000;border-radius:8px;font-size:14px;font-weight:700;text-align:center;text-decoration:none;">← Back to Sign In</a>';
} else if (code) {
  // PKCE flow — exchange code for session
  onSessionReady(await sb.auth.exchangeCodeForSession(code));
} else if (hashParams.access_token && hashParams.type === 'recovery') {
  // Implicit flow — set session from hash tokens
  onSessionReady(await sb.auth.setSession({
    access_token: hashParams.access_token,
    refresh_token: hashParams.refresh_token || ''
  }));
} else {
  errEl.textContent = 'No reset token in URL. Please request a new reset link.';
}

}
initializeRecovery().catch(function(error) { document.getElementById("err").textContent = error.message; });

async function doReset() {
  var pw  = document.getElementById('pw').value;
  var pw2 = document.getElementById('pw2').value;
  if (!pw || pw.length < 6) { errEl.textContent = 'Password must be at least 6 characters.'; return; }
  if (pw !== pw2) { errEl.textContent = 'Passwords do not match.'; return; }
  errEl.textContent = '';
  btn.disabled = true;
  btn.textContent = 'Saving…';
  var res;
  try { res = await sb.auth.updateUser({ password: pw }); }
  catch (error) { errEl.textContent = "Could not save password. Please try again."; btn.disabled = false; btn.textContent = "Set New Password"; return; }
  if (res.error) {
    errEl.textContent = res.error.message;
    btn.disabled = false;
    btn.textContent = 'Set New Password';
    return;
  }
  document.getElementById('form-area').style.display = 'none';
  document.getElementById('done').style.display = 'block';
}
</script>
</body>
</html>
