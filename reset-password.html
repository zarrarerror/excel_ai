<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password — Shayntech Excel AI</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#0f1117;color:#e2e8f0;
  display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.card{background:#1a1f2e;border:1px solid #2a2f45;border-radius:14px;
  padding:32px 28px;width:100%;max-width:360px}
h1{font-size:20px;font-weight:800;color:#00e5a0;margin-bottom:6px}
p{font-size:12px;color:#64748b;margin-bottom:24px}
label{display:block;font-size:11px;color:#94a3b8;margin-bottom:4px;font-weight:500}
input{width:100%;padding:10px 12px;background:#0f1117;border:1px solid #2a2f45;
  border-radius:8px;color:#e2e8f0;font-size:13px;outline:none;margin-bottom:14px}
input:focus{border-color:#00e5a0}
button{width:100%;padding:11px;background:#00e5a0;color:#000;border:none;
  border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;margin-top:4px}
button:hover{opacity:0.85}
.msg{font-size:12px;margin-top:12px;text-align:center;min-height:18px}
.err{color:#ef4444}.ok{color:#22c55e}
</style>
</head>
<body>
<div class="card">
  <h1>✦ Reset Password</h1>
  <p>Enter your new password below.</p>
  <div id="form-area">
    <label>New Password</label>
    <input type="password" id="pw" placeholder="At least 6 characters"/>
    <label>Confirm Password</label>
    <input type="password" id="pw2" placeholder="Repeat password"/>
    <button onclick="doReset()">Set New Password</button>
    <div class="msg err" id="err"></div>
  </div>
  <div class="msg ok" id="done" style="display:none">
    ✓ Password updated! You can close this tab and sign in to the add-in.
  </div>
</div>
<script>
var SUPABASE_URL  = 'https://rhdaoiieowlxoezhokwl.supabase.co';
var SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJoZGFvaWllb3dseG9lemhva3dsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3OTU3MzMsImV4cCI6MjA5MzM3MTczM30.9ub5xcSckf3IRkdpKJdkkDsjK2oES-iUp03ty4afCK4';
var sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

// Supabase sends #access_token=...&type=recovery in the URL
sb.auth.onAuthStateChange(function(event, session) {
  if (event === 'PASSWORD_RECOVERY') { /* ready to set new password */ }
});

async function doReset() {
  var pw  = document.getElementById('pw').value;
  var pw2 = document.getElementById('pw2').value;
  var err = document.getElementById('err');
  if (!pw || pw.length < 6) { err.textContent = 'Password must be at least 6 characters.'; return; }
  if (pw !== pw2) { err.textContent = 'Passwords do not match.'; return; }
  err.textContent = '';
  var res = await sb.auth.updateUser({ password: pw });
  if (res.error) { err.textContent = res.error.message; return; }
  document.getElementById('form-area').style.display = 'none';
  document.getElementById('done').style.display = 'block';
}
</script>
</body>
</html>
